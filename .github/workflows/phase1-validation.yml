name: Phase 1 Discogs Validation (isolated, read-only)

# No schedule, no deploy, never touches main. Repo files are never modified (checked below).
# Results go to validation_out/, are uploaded as an artifact, and are ALSO force-pushed to ONE
# dedicated results branch (phase1-full-results; the older phase1-validation-results branch is kept untouched) so they can be loaded into the preview.
# Progress is kept in the Actions cache so a later run RESUMES where this one stopped.
on:
  # Starts a small first test (20 pressings) whenever THIS file changes on the branch. Needed because
  # a manual "Run workflow" button only appears for workflows that exist on the default branch.
  push:
    branches: [phase1-valuation-accuracy]
    paths: [".github/workflows/phase1-validation.yml"]
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Stop cleanly after this many minutes (resume by running again)"
        default: "300"
      limit:
        description: "Max NEW pressings to look up this run (blank = no limit; try 20 first)"
        default: ""

permissions:
  contents: write   # used ONLY by the last step, which pushes to phase1-validation-results

concurrency:
  group: phase1-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      DEAL_HUNTER_DISABLE_NOTIFY: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests first
        run: |
          python -m pip install pytest requests beautifulsoup4
          python -m pytest -q

      - name: Restore previous validation progress
        uses: actions/cache/restore@v4
        with:
          path: validation_out/state.json
          key: phase1-validation-state-none
          restore-keys: phase1-validation-state-

      - name: Fetch previous (old matcher) results as the old-vs-new baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p validation_out
          git fetch -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" phase1-validation-results:refs/remotes/origin/baseline || true
          git show refs/remotes/origin/baseline:validation_results.json > validation_out/baseline_results.json || echo "[]" > validation_out/baseline_results.json

      - name: Probe providers for identifiers (UPC/EAN/SKU/JSON-LD)
        run: python scripts/provider_probe.py --out validation_out || echo "probe failed (continuing without identifiers)"

      - name: Validate against live Discogs (strict matcher, no legacy caches)
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          ARGS="--out validation_out --max-minutes ${{ inputs.max_minutes || '300' }}"
          LIMIT="${{ github.event_name == 'push' && '20' || inputs.limit }}"
          # a push whose commit message contains [full] runs the whole set (resumable) instead of 20
          if [[ "$COMMIT_MSG" == *"[full]"* ]]; then LIMIT=""; fi
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          ARGS="$ARGS --identifiers validation_out/identifiers_by_link.json"
          python scripts/phase1_validation.py $ARGS

      - name: Save progress for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: validation_out/state.json
          key: phase1-validation-state-${{ github.run_id }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-validation-results
          path: validation_out/
          retention-days: 30

      - name: Show summary
        if: always()
        run: |
          echo '### Phase 1 validation' >> "$GITHUB_STEP_SUMMARY"
          if [ -f validation_out/validation_summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat validation_out/validation_summary.json >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prove no tracked repo file was modified
        if: always()
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Tracked files changed:"; git status --short --untracked-files=no; git diff --stat | tail -20; exit 1
          fi
          echo "repo untouched"
# retrigger 1795165858
# rerun 1795166062
# rerun 1795166199
# rerun 1795166586

      - name: Publish results to the isolated results branch (never main)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          [ -f validation_out/validation_summary.json ] || { echo "no results to publish"; exit 0; }
          BR=phase1-full-results
          D=$(mktemp -d)
          cp validation_out/*.json "$D"/ && rm -f "$D/state.json" "$D/baseline_results.json" "$D/identifiers_by_link.json"
          cd "$D"
          git init -q -b "$BR"
          git config user.name "validation-bot"; git config user.email "validation-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Phase 1 validation results (run ${{ github.run_id }})"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$BR"
          echo "published to branch $BR"
